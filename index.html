<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDIMaster</title>
  <meta name="description" content="Editors and Branch Libraries for MIDI instruments and effects, entirely over MIDI.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314161c'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23f2b544' stroke-width='5'/%3E%3Ccircle cx='32' cy='19' r='3.5' fill='%23f2b544'/%3E%3Ccircle cx='21' cy='26' r='3.5' fill='%23f2b544'/%3E%3Ccircle cx='43' cy='26' r='3.5' fill='%23f2b544'/%3E%3Ccircle cx='24' cy='39' r='3.5' fill='%23f2b544'/%3E%3Ccircle cx='40' cy='39' r='3.5' fill='%23f2b544'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" id="brand" title="All devices"><span class="logo">♪</span>MIDIMaster</button>
      <div class="crumb" id="crumb"></div>
      <div class="conn" id="conn-status" title="MIDI connection"></div>
      <div id="module-status"></div>
      <div class="spacer"></div>
      <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busy-text"></span></div>
      <div class="row" id="dock-buttons"></div>
      <button class="icon-btn" id="btn-panic" title="All notes off (panic)">Panic</button>
      <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
    </header>
    <nav class="sidebar" id="nav"></nav>
    <main id="view"></main>
    <aside class="dock" id="dock" hidden></aside>
    <footer class="keyboard-dock" id="keyboard-dock"></footer>
    <div class="toasts" id="toasts"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
