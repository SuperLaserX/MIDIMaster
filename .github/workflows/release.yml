# Desktop builds of MIDIMaster for Windows, macOS and Linux (electron-builder).
# Runs on a version tag (v1.0.0...) or by hand; the installers are attached to the run as artifacts.
# Code signing is not set up: Windows SmartScreen and macOS Gatekeeper warn on first start until it is
# (macOS: a Developer ID certificate and notarization; Windows: a code signing certificate).
name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: midimaster-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
